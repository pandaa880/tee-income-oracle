[workspace]
members = ["programs/oracle", "programs/demo-pool", "tio-core"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

# From the Anchor 1.2 workspace template. overflow-checks stays on in release:
# silent integer wrap-around is a classic on-chain money bug.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# enclave/ is intentionally NOT a workspace member — it builds as a Docker
# image run via docker-compose on Marlin Oyster (images pinned by digest),
# a different toolchain and target than the Anchor programs above.
# See enclave/README.md.

[package]
name = "demo-pool"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "demo_pool"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "oracle/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.2.0"
# SPL Token accounts and CPI. The pool lends classic SPL Token mints only and
# uses the `token` types; `token_2022` is on because Anchor's `init` for a
# token account calls `token_interface::initialize_account3`.
anchor-spl = { version = "1.2.0", default-features = false, features = ["token", "token_2022"] }
# `EnclaveEntry` and the SAS / payload layouts (FORMATS §7, §13), as a library:
# `cpi` turns off the oracle's entrypoint.
oracle = { path = "../oracle", features = ["cpi"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

# No `as` casts that can truncate (CODING-GUIDELINES §2).
[lints.clippy]
cast_possible_truncation = "deny"
